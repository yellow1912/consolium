# Woodpecker CI — yellow1912/consolium
#
# NOTE: local directory is "consilium" but the GitHub repo (and this
# pipeline's home) is yellow1912/consolium — different spelling, different
# owner from the Nilead org. Not a Nilead repo, so no KIT_TOKEN needed even
# if it were required: package.json/bun.lock pull only public npm packages
# (@anthropic-ai/sdk, @openai/codex-sdk, ink, drizzle-orm, etc.), nothing
# from a private git dependency.
#
# No service containers: drizzle-kit/drizzle-orm are present but there is no
# drizzle.config.* and no Postgres/Redis dependency — persistence here is
# local, not a networked service the tests would need to reach by name.
#
# No secrets: tests were verified locally with ANTHROPIC_API_KEY unset and
# no .env file present; 331 pass / 0 fail, no network calls in the test
# files. council/adapter tests mock the provider clients rather than hitting
# them for real.
#
# No lint step: no eslint/biome config or dependency in this repo, so there
# is nothing real to gate on. `bun run test` is the genuine check that exists.
#
# agent-launcher.test.ts genuinely launches (or attempts to launch) a real
# tmux session/window and checks the result, rather than mocking it — the
# oven/bun image has no tmux binary, so that suite would otherwise fail for
# real (not something to paper over: two of its tests exercise real tmux
# behavior). Installing tmux is a small apt package and lets the tests run
# for real instead of skipping them.

# Which events run this pipeline: pull requests, pushes to the default
# branch, and manual runs from the UI. Deliberately not
# pull_request_metadata (a description/label edit or "ready for review"),
# pull_request_closed (the merge's own push to the default branch runs
# anyway), or pushes to feature branches (the PR's run covers them): each
# of those re-ran the full suite on an already-tested commit, on a CI host
# shared with production (2026-09-29: 64 pipelines queued).
when:
  - event: [pull_request, manual]
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

labels:
  backend: docker

steps:
  - name: test
    image: oven/bun:1
    commands:
      - apt-get update -qq && apt-get install -y -qq tmux
      - bun install --frozen-lockfile
      - bun run test
